<!DOCTYPE html>
<html lang="pt-BR" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Gastos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .task-item.completed .item-name, .task-item.completed .item-date, .task-item.completed .item-responsible { text-decoration: line-through; color: #9ca3af; }
        .dark .task-item.completed .item-name, .dark .task-item.completed .item-date, .dark .task-item.completed .item-responsible { color: #4b5563; }
        .edit-input { border: 1px solid #d1d5db; border-radius: 0.375rem; padding: 0.25rem 0.5rem; width: 100%; }
        #app-loader { display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(255, 255, 255, 0.8); z-index: 9999; justify-content: center; align-items: center; }
        .dark #app-loader { background-color: rgba(17, 24, 39, 0.8); }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .category-card.sortable-ghost, .task-item.sortable-ghost { opacity: 0.4; background: #dbeafe; }
        .dark .category-card.sortable-ghost, .dark .task-item.sortable-ghost { background: #374151; }
        .handle { cursor: grab; }
        .handle:active { cursor: grabbing; }
        .category-title-text, .main-title-text { cursor: pointer; }
        .view-btn { color: #374151; background-color: white; border: 1px solid #e5e7eb; }
        .dark .view-btn { color: #d1d5db; background-color: #374151; border-color: #4b5563; }
        .view-btn:hover { background-color: #f9fafb; }
        .dark .view-btn:hover { background-color: #4b5563; }
        .view-btn.active { background-color: #3B82F6; color: white; border-color: #3B82F6; }
        .dark .view-btn.active { background-color: #2563EB; border-color: #2563EB; }
        .calendar-day { min-height: 120px; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 transition-colors duration-300">

    <div id="app-loader"><div class="loader"></div></div>

    <div id="board-selection-screen" class="hidden">
        <div class="container mx-auto p-4 sm:p-6 lg:p-8 max-w-3xl">
            <header class="text-center mb-6 relative">
                <h1 class="text-3xl md:text-4xl font-bold">Meus Planejamentos</h1>
                <button id="theme-toggle-select" class="absolute top-0 right-0 p-2 rounded-full text-gray-500 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-700">
                    <i id="theme-toggle-dark-icon-select" class="fas fa-moon text-xl hidden"></i>
                    <i id="theme-toggle-light-icon-select" class="fas fa-sun text-xl hidden"></i>
                </button>
            </header>
            
            <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-lg mb-8">
                <h3 class="text-xl font-bold mb-4">Criar Novo Quadro</h3>
                <div class="flex space-x-2">
                    <input type="text" id="new-board-name" placeholder="Ex: Casamento, Reforma da Casa" class="flex-grow w-full rounded-md border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700">
                    <button id="create-board-btn" class="bg-green-600 text-white font-bold py-2 px-3 rounded-lg hover:bg-green-700"><i class="fas fa-plus"></i> Criar</button>
                </div>
            </div>

            <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-lg">
                <h3 class="text-xl font-bold mb-4">Quadros Existentes</h3>
                <ul id="board-list" class="space-y-3">
                    </ul>
                <p id="no-boards-msg" class="text-gray-500 dark:text-gray-400 hidden">Nenhum quadro encontrado. Crie um novo acima!</p>
            </div>
        </div>
    </div>


    <div id="main-app" class="hidden"> <div class="container mx-auto p-4 sm:p-6 lg:p-8 max-w-7xl">
            <header class="text-center mb-6 relative">
                
                <button id="back-to-boards-btn" class="absolute top-0 left-0 p-2 rounded-full text-gray-500 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-700">
                    <i class="fas fa-arrow-left text-xl"></i>
                </button>

                <div class="flex justify-center items-center gap-2">
                    <h1 id="main-title-text" class="text-3xl md:text-4xl font-bold"></h1>
                    <button id="edit-main-title-btn" class="text-gray-500 hover:text-blue-600"><i class="fas fa-pencil-alt"></i></button>
                </div>
                <button id="theme-toggle-main" class="absolute top-0 right-0 p-2 rounded-full text-gray-500 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-700">
                    <i id="theme-toggle-dark-icon-main" class="fas fa-moon text-xl hidden"></i>
                    <i id="theme-toggle-light-icon-main" class="fas fa-sun text-xl hidden"></i>
                </button>
            </header>
            
            <div class="flex justify-center mb-8">
                <div class="inline-flex rounded-md shadow-sm" role="group">
                    <button type="button" id="view-kanban-btn" class="view-btn active py-2 px-4 text-sm font-medium rounded-l-lg"><i class="fas fa-th-large mr-2"></i>Quadros</button>
                    <button type="button" id="view-list-btn" class="view-btn py-2 px-4 text-sm font-medium"><i class="fas fa-list-ul mr-2"></i>Lista</button>
                    <button type="button" id="view-calendar-btn" class="view-btn py-2 px-4 text-sm font-medium"><i class="fas fa-calendar-alt mr-2"></i>Calendário</button>
                    <button type="button" id="view-dashboard-btn" class="view-btn py-2 px-4 text-sm font-medium rounded-r-md"><i class="fas fa-chart-pie mr-2"></i>Dashboard</button>
                </div>
            </div>

            <main id="kanban-view" class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="lg:col-span-2 space-y-8" id="categories-container"></div>
                <aside class="col-span-1 space-y-8 lg:sticky lg:top-8">
                    <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-lg">
                        <h3 class="text-xl font-bold mb-4 border-b pb-2">Resumo Geral</h3>
                        <div class="space-y-3">
                            <div class="flex justify-between items-center text-lg"><span>Custo Total:</span><span id="grand-total" class="font-bold text-blue-600">R$ 0,00</span></div>
                            <div class="flex justify-between items-center text-lg"><span>Total Pago:</span><span id="paid-total" class="font-bold text-green-600">R$ 0,00</span></div>
                            <div class="flex justify-between items-center text-lg"><span>Total Pendente:</span><span id="pending-total" class="font-bold text-red-600">R$ 0,00</span></div>
                        </div>
                    </div>
                    <div id="add-category-widget" class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-lg">
                        <h3 class="text-xl font-bold mb-4">Adicionar Categoria</h3>
                        <div class="flex space-x-2">
                            <input type="text" id="new-category-name" placeholder="Ex: Lua de Mel" class="flex-grow w-full rounded-md border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700">
                            <button id="add-category-btn" class="bg-green-600 text-white font-bold py-2 px-3 rounded-lg hover:bg-green-700"><i class="fas fa-plus"></i></button>
                        </div>
                    </div>
                     <div id="tools-widget" class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-lg">
                        <h3 class="text-xl font-bold mb-4">Ferramentas</h3>
                        <div class="space-y-3">
                            <button id="export-csv-btn" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700"><i class="fas fa-file-csv mr-2"></i>Exportar</button>
                            <button id="import-csv-btn" class="w-full bg-purple-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-purple-700 mt-2"><i class="fas fa-file-import mr-2"></i>Importar</button>
                            <input type="file" id="import-file-input" class="hidden" accept=".csv, .xlsx, .xls">
                        </div>
                    </div>
                </aside>
            </main>
            
            <main id="list-view" class="hidden space-y-8"></main>
            <main id="calendar-view" class="hidden bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-lg"></main>
            <main id="dashboard-view" class="hidden grid grid-cols-1 md:grid-cols-2 gap-8">
                 <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-lg"><h3 class="text-xl font-bold mb-4">Distribuição por Categoria</h3><canvas id="expense-chart-category"></canvas></div>
                 <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-lg"><h3 class="text-xl font-bold mb-4">Gastos por Responsável</h3><canvas id="expense-chart-responsible"></canvas></div>
            </main>
        </div>
    </div>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, getDoc, collection, getDocs, updateDoc } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCzACPqrKvn3R1zeK4kiVK5e3MzjJ7UDQI",
            authDomain: "controle-de-gastos-pemily.firebaseapp.com",
            projectId: "controle-de-gastos-pemily",
            storageBucket: "controle-de-gastos-pemily.appspot.com",
            messagingSenderId: "819710772267",
            appId: "1:819710772267:web:ff4dde111635a6eeef166e",
            measurementId: "G-88JFJ6YTW1"
        };

        // --- DOM ELEMENTS ---
        const appLoader = document.getElementById('app-loader');
        const mainApp = document.getElementById('main-app');
        const mainTitleText = document.getElementById('main-title-text');
        const editMainTitleBtn = document.getElementById('edit-main-title-btn');
        const categoriesContainer = document.getElementById('categories-container');
        const newCategoryNameInput = document.getElementById('new-category-name');
        const addCategoryBtn = document.getElementById('add-category-btn');
        const chartCanvasCategory = document.getElementById('expense-chart-category');
        const chartCanvasResponsible = document.getElementById('expense-chart-responsible');
        
        // Elementos das Visualizações
        const kanbanView = document.getElementById('kanban-view');
        const listView = document.getElementById('list-view');
        const calendarView = document.getElementById('calendar-view');
        const dashboardView = document.getElementById('dashboard-view');
        const viewKanbanBtn = document.getElementById('view-kanban-btn');
        const viewListBtn = document.getElementById('view-list-btn');
        const viewCalendarBtn = document.getElementById('view-calendar-btn');
        const viewDashboardBtn = document.getElementById('view-dashboard-btn');
        const exportCsvBtn = document.getElementById('export-csv-btn');
        const importCsvBtn = document.getElementById('import-csv-btn');
        const importFileInput = document.getElementById('import-file-input');
        const addCategoryWidget = document.getElementById('add-category-widget');
        const toolsWidget = document.getElementById('tools-widget');

        // NOVOS Elementos da Tela de Seleção
        const boardSelectionScreen = document.getElementById('board-selection-screen');
        const boardList = document.getElementById('board-list');
        const noBoardsMsg = document.getElementById('no-boards-msg');
        const newBoardNameInput = document.getElementById('new-board-name');
        const createBoardBtn = document.getElementById('create-board-btn');
        const backToBoardsBtn = document.getElementById('back-to-boards-btn');

        // Botões de Tema Duplicados
        const themeToggleSelectBtn = document.getElementById('theme-toggle-select');
        const themeToggleMainBtn = document.getElementById('theme-toggle-main');

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let appData = {};
        // const FIXED_PLAN_ID = 'pemily1601'; // <-- REMOVIDO
        let currentPlanId = null; // <-- Agora começa nulo
        let unsubscribe; 
        let categoryChart = null;
        let responsibleChart = null;
        let currentView = 'kanban';
        let calendarDate = new Date();
        
        const emptyData = { title: "Novo Planejamento", categoryOrder: [], expenses: {} };
        
        // --- NOVAS FUNÇÕES DE GERENCIAMENTO DE QUADRO ---

        // Gera um ID aleatório simples
        const generateId = () => Date.now().toString(36) + Math.random().toString(36).substring(2, 9);

        // Pega a lista de IDs de quadros do localStorage
        const getMyBoards = () => JSON.parse(localStorage.getItem('myBoards')) || [];

        // Adiciona um ID de quadro ao localStorage
        const addBoardToLocal = (boardId) => {
            const boards = getMyBoards();
            if (!boards.includes(boardId)) {
                boards.push(boardId);
                localStorage.setItem('myBoards', JSON.stringify(boards));
            }
        };

        // Mostra a tela de seleção de quadros
        const showBoardSelectionScreen = async () => {
            if (unsubscribe) unsubscribe(); // Garante que paramos de ouvir o quadro anterior
            currentPlanId = null;
            appData = {};
            
            appLoader.style.display = 'flex';
            mainApp.classList.add('hidden');
            boardSelectionScreen.classList.remove('hidden');
            
            const boardIds = getMyBoards();
            
            // Lógica de "migração" para encontrar o quadro 'pemily1601' se for o primeiro acesso
            if (boardIds.length === 0) {
                try {
                    const legacyDoc = await getDoc(doc(db, "plans", "pemily1601"));
                    if (legacyDoc.exists()) {
                        addBoardToLocal("pemily1601");
                        boardIds.push("pemily1601");
                    }
                } catch (e) { console.warn("Quadro legado 'pemily1601' não encontrado.", e); }
            }

            boardList.innerHTML = ''; // Limpa a lista
            
            if (boardIds.length === 0) {
                noBoardsMsg.classList.remove('hidden');
            } else {
                noBoardsMsg.classList.add('hidden');
                // Busca o título de cada quadro para exibir na lista
                const boardPromises = boardIds.map(id => getDoc(doc(db, "plans", id)));
                const boardDocs = await Promise.all(boardPromises);

                boardDocs.forEach(docSnap => {
                    if (docSnap.exists()) {
                        const board = docSnap.data();
                        const li = document.createElement('li');
                        li.className = "flex justify-between items-center p-4 bg-gray-50 dark:bg-gray-700 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-600 cursor-pointer";
                        li.dataset.boardId = docSnap.id;
                        li.innerHTML = `<span class="font-semibold text-lg">${board.title || 'Quadro Sem Título'}</span><i class="fas fa-chevron-right text-gray-400"></i>`;
                        li.addEventListener('click', () => loadAndShowBoard(docSnap.id));
                        boardList.appendChild(li);
                    } else {
                        // Se o quadro não existe mais no Firestore, remove do localStorage
                        const updatedBoards = getMyBoards().filter(id => id !== docSnap.id);
                        localStorage.setItem('myBoards', JSON.stringify(updatedBoards));
                    }
                });
            }
            appLoader.style.display = 'none';
        };

        // Carrega um quadro específico e mostra a tela principal
        const loadAndShowBoard = (planId) => {
            boardSelectionScreen.classList.add('hidden');
            mainApp.classList.remove('hidden');
            appLoader.style.display = 'flex';
            loadPlan(planId); // Chama a sua função original de carregar
        };

        // --- FUNÇÕES EXISTENTES (Modificadas e Originais) ---

        const saveData = async (planId, dataToSave) => {
            if (!planId) return;
            const cleanData = { ...dataToSave };
            delete cleanData.owner; delete cleanData.members; delete cleanData.memberIds;
            try {
                const docRef = doc(db, "plans", planId);
                await setDoc(docRef, cleanData); 
            } catch (error) {
                console.error("Error saving data: ", error);
                alert("Não foi possível salvar os dados.");
            }
        };
        
        const saveCurrentPlanData = () => {
            if (!currentPlanId) return; // Proteção para não salvar sem ID
            saveData(currentPlanId, appData);
        }

        const formatCurrency = (value) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value || 0);

        // --- Funções de Gráfico (sem alteração) ---
        const renderCategoryChart = () => {
            const isDarkMode = document.documentElement.classList.contains('dark');
            const textColor = isDarkMode ? 'rgba(255, 255, 255, 0.7)' : 'rgba(0, 0, 0, 0.7)';
            Chart.defaults.color = textColor;
            const ctx = chartCanvasCategory.getContext('2d');
            const labels = appData.categoryOrder || Object.keys(appData.expenses || {});
            const data = labels.map(categoryName => (appData.expenses[categoryName] || []).reduce((sum, item) => sum + (parseFloat(item.value) || 0), 0));
            const backgroundColors = ['#3B82F6', '#10B981', '#F59E0B', '#EF4444', '#8B5CF6', '#EC4899', '#6366F1', '#F97316', '#FBBF24', '#22C55E', '#38BDF8', '#FB923C'];
            if (categoryChart) categoryChart.destroy();
            categoryChart = new Chart(ctx, { type: 'doughnut', data: { labels, datasets: [{ label: 'Gastos por Categoria', data, backgroundColor: (c) => backgroundColors[c.dataIndex % backgroundColors.length], hoverOffset: 4, borderColor: isDarkMode ? '#1f2937' : '#fff' }] }, options: { responsive: true, plugins: { legend: { position: 'top', labels: { color: textColor } }, tooltip: { callbacks: { label: (c) => `${c.label}: ${formatCurrency(c.parsed)}` } } } } });
        };
        const renderResponsibleChart = () => {
            const isDarkMode = document.documentElement.classList.contains('dark');
            const textColor = isDarkMode ? 'rgba(255, 255, 255, 0.7)' : 'rgba(0, 0, 0, 0.7)';
            const gridColor = isDarkMode ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0, 0, 0, 0.1)';
            Chart.defaults.color = textColor;
            const ctx = chartCanvasResponsible.getContext('2d');
            const responsibleData = {};
            Object.values(appData.expenses || {}).flat().forEach(item => {
                const responsible = item.responsible || 'N/A';
                if (!responsibleData[responsible]) responsibleData[responsible] = 0;
                responsibleData[responsible] += parseFloat(item.value) || 0;
            });
            const labels = Object.keys(responsibleData);
            const data = Object.values(responsibleData);
            const backgroundColors = ['#3B82F6', '#10B981', '#F59E0B', '#EF4444', '#8B5CF6', '#EC4899'];
            if (responsibleChart) responsibleChart.destroy();
            responsibleChart = new Chart(ctx, {
                type: 'bar',
                data: { labels, datasets: [{ label: 'Gastos por Responsável', data, backgroundColor: (c) => backgroundColors[c.dataIndex % backgroundColors.length] }] },
                options: {
                    indexAxis: 'y', responsive: true,
                    scales: { x: { ticks: { callback: (value) => formatCurrency(value) }, grid: { color: gridColor } }, y: { grid: { color: gridColor } } },
                    plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => `${c.label}: ${formatCurrency(c.parsed.x)}` } } }
                }
            });
        };
        const renderCharts = () => {
            if (!appData.expenses) return;
            renderCategoryChart();
            renderResponsibleChart();
        };

        // --- Funções de Renderização de Visualização (sem alteração) ---
        const renderKanbanView = () => {
            categoriesContainer.innerHTML = '';
            let grandTotal = 0, paidTotal = 0;
            const canEdit = true; 

            (appData.categoryOrder || []).forEach(categoryName => {
                 if (!appData.expenses[categoryName]) { appData.expenses[categoryName] = []; }
                const categoryCard = document.createElement('div');
                categoryCard.className = 'bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-lg category-card';
                categoryCard.dataset.categoryName = categoryName;
                let categoryTotal = 0, categoryPaid = 0;
                let itemsHtml = '';
                (appData.expenses[categoryName] || []).forEach((item, index) => {
                    const itemValue = parseFloat(item.value) || 0;
                    categoryTotal += itemValue;
                    if(item.completed) { paidTotal += itemValue; categoryPaid += itemValue; }
                    const formattedDate = item.date ? new Date(item.date + 'T00:00:00').toLocaleDateString('pt-BR') : 'Sem data';
                    itemsHtml += `<li class="task-item ${item.completed ? 'completed' : ''}" data-category="${categoryName}" data-index="${index}">
                        <div class="view-mode flex items-center justify-between py-2 border-b dark:border-gray-700">
                            <div class="flex items-center flex-grow min-w-0"> 
                                ${canEdit ? '<i class="fas fa-grip-vertical handle item-handle text-gray-400 dark:text-gray-500 mr-3 flex-shrink-0"></i>' : ''}
                                <input type="checkbox" class="h-4 w-4 rounded border-gray-300 dark:border-gray-600 text-blue-600 focus:ring-blue-500 cursor-pointer item-checkbox flex-shrink-0" ${item.completed ? 'checked' : ''}>
                                <div class="ml-3 flex-grow min-w-0"> 
                                     <p class="item-name text-gray-800 dark:text-gray-200 truncate">${item.name || 'Sem nome'}</p> 
                                     <p class="text-sm text-gray-500 dark:text-gray-400 truncate"><span class="item-date">${formattedDate}</span> <span class="font-semibold item-responsible">(${item.responsible || 'N/A'})</span></p> 
                                </div>
                            </div>
                            <div class="flex items-center flex-shrink-0 ml-2"> 
                                <span class="font-semibold mr-4 item-value">${formatCurrency(item.value)}</span>
                                ${canEdit ? `<button class="edit-btn text-gray-500 hover:text-blue-700 dark:hover:text-blue-400 mr-2"><i class="fas fa-pencil-alt"></i></button><button class="delete-btn text-gray-500 hover:text-red-700 dark:hover:text-red-400"><i class="fas fa-trash-alt"></i></button>` : ''}
                            </div>
                        </div>
                        <div class="edit-mode hidden flex items-center justify-between py-2 border-b dark:border-gray-700">
                            <div class="flex-grow mr-2 space-y-2"><input type="text" class="edit-input edit-name dark:bg-gray-700 dark:border-gray-600" value="${item.name || ''}"><input type="text" class="edit-input edit-responsible dark:bg-gray-700 dark:border-gray-600" value="${item.responsible || ''}" placeholder="Responsável"><input type="date" class="edit-input edit-date dark:bg-gray-700 dark:border-gray-600" value="${item.date || ''}"><input type="number" step="0.01" class="edit-input edit-value dark:bg-gray-700 dark:border-gray-600" value="${item.value || 0}"></div>
                            <div class="flex items-center gap-2"><button class="save-btn text-green-500 hover:text-green-700 dark:hover:text-green-400"><i class="fas fa-save fa-lg"></i></button><button class="cancel-btn text-red-500 hover:text-red-700 dark:hover:text-red-400"><i class="fas fa-times fa-lg"></i></button></div>
                        </div>
                    </li>`;
                });
                grandTotal += categoryTotal;
                if (canEdit) { itemsHtml += `<li class="add-item-inline-area mt-2"><button class="add-item-inline-btn text-sm text-gray-500 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 w-full text-left p-2 rounded hover:bg-gray-100 dark:hover:bg-gray-700"><i class="fas fa-plus mr-2"></i> Adicionar um item</button></li>`; }
                const categoryPending = categoryTotal - categoryPaid;
                categoryCard.innerHTML = `<h3 class="text-xl font-bold text-gray-900 dark:text-white mb-4 flex justify-between items-center"><div class="flex items-center">${canEdit ? '<i class="fas fa-grip-vertical handle category-handle text-gray-400 dark:text-gray-500 mr-3"></i>' : ''}<span class="category-title-text">${categoryName}</span>${canEdit ? `<button class="edit-category-title-btn text-gray-400 hover:text-blue-700 dark:hover:text-blue-400 ml-2"><i class="fas fa-pencil-alt fa-xs"></i></button>` : ''}</div><div class="flex items-center"><span class="text-lg text-blue-600 dark:text-blue-400 mr-3">${formatCurrency(categoryTotal)}</span>${canEdit ? `<button class="delete-category-btn text-gray-400 hover:text-red-700 dark:hover:text-red-400" data-category-name="${categoryName}"><i class="fas fa-trash-alt"></i></button>` : ''}</div></h3><ul class="space-y-2 item-list">${itemsHtml}</ul><div class="text-sm mt-3 pt-3 border-t dark:border-gray-700 flex justify-between text-gray-600 dark:text-gray-400"><span>Pago: <strong class="text-green-600 dark:text-green-400">${formatCurrency(categoryPaid)}</strong></span><span>Pendente: <strong class="text-red-600 dark:text-red-400">${formatCurrency(categoryPending)}</strong></span></div>`;
                categoriesContainer.appendChild(categoryCard);
            });
            document.getElementById('grand-total').textContent = formatCurrency(grandTotal);
            document.getElementById('paid-total').textContent = formatCurrency(paidTotal);
            document.getElementById('pending-total').textContent = formatCurrency(grandTotal - paidTotal);
            addCategoryWidget.style.display = 'block';
            toolsWidget.style.display = 'block';
            editMainTitleBtn.style.display = 'inline-block';
        };

        const renderListView = () => {
            listView.innerHTML = '';
            if (!appData.expenses) return;
            const allItems = (appData.categoryOrder || [])
                .flatMap(categoryName => 
                    (appData.expenses[categoryName] || []).map(item => ({...item, category: categoryName}))
                )
                .sort((a, b) => (a.date || '9999-12-31').localeCompare(b.date || '9999-12-31'));
            if (allItems.length === 0) {
                 listView.innerHTML = '<div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-lg text-center"><p>Nenhum item para exibir.</p></div>';
                 return;
            }
            let html = `
                <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-700">
                        <thead class="bg-gray-50 dark:bg-gray-700">
                            <tr>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Status</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Item</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Categoria</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Data</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Responsável</th>
                                <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Valor</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-200 dark:divide-gray-700">`;
            allItems.forEach(item => {
                const formattedDate = item.date ? new Date(item.date + 'T00:00:00').toLocaleDateString('pt-BR') : '---';
                const statusIcon = item.completed ? '<i class="fas fa-check-circle text-green-500"></i>' : '<i class="far fa-circle text-gray-400"></i>';
                html += `
                    <tr class="${item.completed ? 'bg-gray-50 dark:bg-gray-900 opacity-60' : 'bg-white dark:bg-gray-800'}">
                        <td class="px-6 py-4 whitespace-nowrap text-center">${statusIcon}</td>
                        <td class="px-6 py-4 whitespace-nowrap"><div class="text-sm font-medium text-gray-900 dark:text-gray-100 ${item.completed ? 'line-through' : ''}">${item.name || 'Sem nome'}</div></td>
                        <td class="px-6 py-4 whitespace-nowrap"><span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200">${item.category}</span></td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400 ${item.completed ? 'line-through' : ''}">${formattedDate}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400 ${item.completed ? 'line-through' : ''}">${item.responsible || 'N/A'}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium text-gray-900 dark:text-gray-100 ${item.completed ? 'line-through' : ''}">${formatCurrency(item.value)}</td>
                    </tr>`;
            });
            html += `</tbody></table></div>`;
            listView.innerHTML = html;
        };
        const renderCalendarView = () => {
            calendarView.innerHTML = '';
            if (!appData.expenses) return;
            const itemsByDate = {};
            (appData.categoryOrder || []).flatMap(categoryName => 
                (appData.expenses[categoryName] || [])
            ).forEach(item => {
                if (item.date) {
                    if (!itemsByDate[item.date]) itemsByDate[item.date] = [];
                    itemsByDate[item.date].push(item);
                }
            });
            const year = calendarDate.getFullYear();
            const month = calendarDate.getMonth();
            const monthName = calendarDate.toLocaleString('pt-BR', { month: 'long' });
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const today = new Date().toISOString().split('T')[0];
            const weekDays = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
            let html = `
                <div class="flex justify-between items-center mb-4">
                    <button id="calendar-prev-month" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700"><i class="fas fa-chevron-left"></i></button>
                    <h3 class="text-2xl font-bold capitalize">${monthName} de ${year}</h3>
                    <button id="calendar-next-month" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700"><i class="fas fa-chevron-right"></i></button>
                </div>
                <div class="grid grid-cols-7 gap-1 mb-2">
                    ${weekDays.map(day => `<div class="text-center font-semibold text-gray-500 dark:text-gray-400 text-sm">${day}</div>`).join('')}
                </div>
                <div class="grid grid-cols-7 gap-1">`;
            for (let i = 0; i < firstDay; i++) {
                html += '<div class="border border-transparent"></div>';
            }
            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${(month + 1).toString().padStart(2, '0')}-${day.toString().padStart(2, '0')}`;
                const isToday = dateStr === today;
                const dayItems = itemsByDate[dateStr] || [];
                html += `<div class="calendar-day border dark:border-gray-700 p-2 rounded ${isToday ? 'bg-blue-100 dark:bg-blue-800 dark:bg-opacity-20' : ''}">
                            <div class="font-bold text-right ${isToday ? 'text-blue-600 dark:text-blue-300' : ''}">${day}</div>
                            <ul class="text-xs space-y-1 mt-1 overflow-y-auto" style="max-height: 80px;">`;
                dayItems.sort((a,b) => (a.value || 0) - (b.value || 0));
                dayItems.forEach(item => {
                    html += `<li class="p-1 rounded truncate ${item.completed ? 'bg-green-100 dark:bg-green-900 text-green-800 dark:text-green-200 opacity-70 line-through' : 'bg-gray-100 dark:bg-gray-700'}" title="${item.name} - ${formatCurrency(item.value)}">
                                <span class="font-semibold">${item.name}</span>
                             </li>`;
                });
                html += `</ul></div>`;
            }
            html += `</div>`;
            calendarView.innerHTML = html;
            document.getElementById('calendar-prev-month').addEventListener('click', () => {
                calendarDate.setMonth(calendarDate.getMonth() - 1);
                renderCalendarView();
            });
            document.getElementById('calendar-next-month').addEventListener('click', () => {
                calendarDate.setMonth(calendarDate.getMonth() + 1);
                renderCalendarView();
            });
        };

        // --- Função de Renderização Principal (Modificada) ---
        const render = () => {
            if (!currentPlanId || !appData.expenses) return; // Se não houver quadro carregado, não faz nada
            mainTitleText.textContent = appData.title || "Sem Título";
            
            // Reseta a visualização para kanban ao carregar um novo quadro
            // (ou pode manter a última visualização salva se preferir)
            // switchView(currentView); // Vamos chamar o switchView para garantir
            
            if (currentView === 'kanban') { renderKanbanView(); initSortable(); }
            else if (currentView === 'list') { renderListView(); }
            else if (currentView === 'calendar') { renderCalendarView(); }
            else if (currentView === 'dashboard') { renderCharts(); } 
        };

        // --- Função de Carregamento do Plano (Modificada) ---
        const loadPlan = (planId) => {
            if (unsubscribe) unsubscribe(); // Cancela o listener anterior

            currentPlanId = planId; // DEFINE O ID ATUAL
            // mainApp.classList.remove('hidden'); // Movido para 'loadAndShowBoard'
            // appLoader.style.display = 'flex'; // Movido para 'loadAndShowBoard'
            
            const docRef = doc(db, "plans", planId);
            unsubscribe = onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists() && docSnap.data().expenses) {
                    appData = docSnap.data();
                    delete appData.owner; delete appData.members; delete appData.memberIds;
                    if (!appData.categoryOrder) { appData.categoryOrder = Object.keys(appData.expenses || {}); }
                } else {
                    // Isso pode acontecer se o ID estiver no localStorage mas for deletado do FB
                    alert("Quadro não encontrado. Retornando à lista.");
                    const updatedBoards = getMyBoards().filter(id => id !== planId);
                    localStorage.setItem('myBoards', JSON.stringify(updatedBoards));
                    showBoardSelectionScreen();
                    return;
                }
                
                // Redefine a visualização para 'kanban' toda vez que um quadro é carregado
                // Isso evita carregar um quadro e mostrar a visualização de 'lista' antiga, por ex.
                switchView('kanban'); 
                
                render(); // Renderiza o quadro
                appLoader.style.display = 'none';
            }, (error) => {
                console.error("Firestore snapshot error:", error);
                alert("Erro ao carregar o quadro.");
                appLoader.style.display = 'none'; 
                showBoardSelectionScreen(); // Volta para a seleção em caso de erro
            });
        };

        const initSortable = () => {
            new Sortable(categoriesContainer, { animation: 150, handle: '.category-handle', onEnd: (evt) => { const movedItem = appData.categoryOrder.splice(evt.oldIndex, 1)[0]; appData.categoryOrder.splice(evt.newIndex, 0, movedItem); saveCurrentPlanData(); } });
            document.querySelectorAll('.item-list').forEach(list => { new Sortable(list, { group: 'shared', animation: 150, handle: '.item-handle', onEnd: (evt) => { const fromCat = evt.from.closest('.category-card').dataset.categoryName; const toCat = evt.to.closest('.category-card').dataset.categoryName; const [movedItem] = appData.expenses[fromCat].splice(evt.oldIndex, 1); if (!appData.expenses[toCat]) appData.expenses[toCat] = []; appData.expenses[toCat].splice(evt.newIndex, 0, movedItem); saveCurrentPlanData(); } }); });
        };

        // --- Listeners de Eventos (Modificados) ---

        // Novo: Criar Quadro
        createBoardBtn.addEventListener('click', async () => {
            const newName = newBoardNameInput.value.trim();
            if (!newName) {
                alert("Por favor, dê um nome ao seu novo quadro.");
                return;
            }
            
            appLoader.style.display = 'flex'; // Mostra o loader
            
            const newId = generateId();
            const newBoardData = { ...emptyData, title: newName };
            
            try {
                await saveData(newId, newBoardData); // Salva o novo quadro vazio no Firestore
                addBoardToLocal(newId); // Adiciona ao localStorage
                newBoardNameInput.value = ''; // Limpa o input
                loadAndShowBoard(newId); // Carrega e mostra o quadro recém-criado
            } catch (error) {
                console.error("Erro ao criar novo quadro:", error);
                alert("Não foi possível criar o quadro.");
                appLoader.style.display = 'none';
            }
        });

        // Novo: Voltar para Seleção
        backToBoardsBtn.addEventListener('click', () => {
            showBoardSelectionScreen();
        });


        // Listeners do Quadro (sem alteração, exceto 'editMainTitleBtn')
        categoriesContainer.addEventListener('click', (e) => {
            const taskItem = e.target.closest('.task-item');
            const categoryBtn = e.target.closest('.delete-category-btn');
            const addItemBtnInline = e.target.closest('.add-item-inline-btn');
            const editCategoryBtn = e.target.closest('.edit-category-title-btn');

            if (editCategoryBtn) {
                const h3 = editCategoryBtn.closest('h3');
                const titleSpan = h3.querySelector('.category-title-text');
                const oldCategoryName = titleSpan.textContent;
                const input = document.createElement('input');
                input.type = 'text'; input.value = oldCategoryName;
                input.className = 'edit-input text-xl font-bold dark:bg-gray-700 dark:border-gray-600';
                titleSpan.style.display = 'none';
                 const handle = h3.querySelector('.handle');
                 if(handle) handle.style.display = 'none'; 
                titleSpan.parentElement.insertBefore(input, titleSpan);
                input.focus(); input.select();
                const saveTitle = () => {
                     const newCategoryName = input.value.trim();
                     if (newCategoryName && newCategoryName !== oldCategoryName) {
                         if (appData.expenses.hasOwnProperty(newCategoryName)) {
                             alert('Essa categoria já existe.'); input.remove(); render(); return;
                         }
                         const oldOrderIndex = appData.categoryOrder.indexOf(oldCategoryName);
                         if (oldOrderIndex > -1) { appData.categoryOrder.splice(oldOrderIndex, 1, newCategoryName); } 
                         else { appData.categoryOrder.push(newCategoryName); }
                         appData.expenses[newCategoryName] = appData.expenses[oldCategoryName];
                         delete appData.expenses[oldCategoryName];
                         saveCurrentPlanData();
                     } else { input.remove(); render(); }
                 };
                 input.addEventListener('blur', saveTitle);
                 input.addEventListener('keydown', (evt) => { if (evt.key === 'Enter') input.blur(); else if (evt.key === 'Escape') { input.remove(); render(); } });
            
            } else if (taskItem) {
                const category = taskItem.dataset.category;
                const index = parseInt(taskItem.dataset.index);

                if (e.target.closest('.edit-btn')) { 
                    taskItem.querySelector('.view-mode').classList.add('hidden');
                    taskItem.querySelector('.edit-mode').classList.remove('hidden');
                } else if (e.target.closest('.save-btn')) { 
                    const editMode = taskItem.querySelector('.edit-mode');
                    appData.expenses[category][index].name = editMode.querySelector('.edit-name').value;
                    appData.expenses[category][index].responsible = editMode.querySelector('.edit-responsible').value;
                    appData.expenses[category][index].date = editMode.querySelector('.edit-date').value;
                    appData.expenses[category][index].value = parseFloat(editMode.querySelector('.edit-value').value) || 0;
                    saveCurrentPlanData(); 
                } else if (e.target.closest('.cancel-btn')) { 
                    render(); 
                } else if (e.target.closest('.delete-btn')) { 
                    appData.expenses[category].splice(index, 1);
                    saveCurrentPlanData(); 
                } else if (e.target.classList.contains('item-checkbox')) { 
                    appData.expenses[category][index].completed = e.target.checked;
                    saveCurrentPlanData(); 
                }
            } else if (categoryBtn) {
                const categoryNameToDelete = categoryBtn.dataset.categoryName;
                if (confirm(`Tem a certeza que quer apagar a categoria "${categoryNameToDelete}"?`)) {
                    delete appData.expenses[categoryNameToDelete];
                    appData.categoryOrder = appData.categoryOrder.filter(name => name !== categoryNameToDelete);
                    saveCurrentPlanData(); 
                }
            } else if (addItemBtnInline) {
                const categoryName = addItemBtnInline.closest('.category-card').dataset.categoryName;
                 if (!appData.expenses[categoryName]) appData.expenses[categoryName] = []; 
                appData.expenses[categoryName].push({ name: "Novo Item", value: 0, date: "", responsible: "", completed: false });
                saveCurrentPlanData().then(() => { 
                    const items = document.querySelector(`.category-card[data-category-name="${categoryName}"]`).querySelectorAll('.task-item');
                    const newItem = items[items.length - 1]; 
                    if (newItem) {
                        const editBtn = newItem.querySelector('.edit-btn');
                        if (editBtn) editBtn.click(); 
                        const nameInput = newItem.querySelector('.edit-name');
                        if (nameInput) { nameInput.focus(); nameInput.select(); }
                    }
                 });
            }
        });

        addCategoryBtn.addEventListener('click', () => {
             const name = newCategoryNameInput.value.trim();
             if (name && !appData.expenses.hasOwnProperty(name)) {
                 appData.expenses[name] = [];
                 if (!appData.categoryOrder) appData.categoryOrder = []; 
                 appData.categoryOrder.push(name);
                 newCategoryNameInput.value = '';
                 saveCurrentPlanData(); 
             } else if (name) { alert('Essa categoria já existe.'); }
        });

        editMainTitleBtn.addEventListener('click', () => {
            const currentTitle = mainTitleText.textContent;
            const newTitle = prompt("Insira o novo título:", currentTitle);
            if (newTitle && newTitle.trim() !== currentTitle) {
                appData.title = newTitle.trim();
                saveCurrentPlanData(); 
                // Atualiza o título na tela de seleção da próxima vez que for carregada
            }
        });

        // --- Funções de Tema (Modificada para 2 botões) ---
        const applyTheme = (theme) => {
            const darkIcons = [document.getElementById('theme-toggle-dark-icon-select'), document.getElementById('theme-toggle-dark-icon-main')];
            const lightIcons = [document.getElementById('theme-toggle-light-icon-select'), document.getElementById('theme-toggle-light-icon-main')];
            
            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
                darkIcons.forEach(i => i.classList.remove('hidden'));
                lightIcons.forEach(i => i.classList.add('hidden'));
            } else {
                document.documentElement.classList.remove('dark');
                darkIcons.forEach(i => i.classList.add('hidden'));
                lightIcons.forEach(i => i.classList.remove('hidden'));
            }
            if (currentView === 'dashboard' && (categoryChart || responsibleChart)) {
                 renderCharts(); 
            }
        };

        const toggleTheme = () => {
            const isDark = document.documentElement.classList.toggle('dark');
            const newTheme = isDark ? 'dark' : 'light';
            localStorage.setItem('theme', newTheme);
            applyTheme(newTheme);
        };

        themeToggleSelectBtn.addEventListener('click', toggleTheme);
        themeToggleMainBtn.addEventListener('click', toggleTheme);


        // --- Funções de Visualização (Modificada) ---
        const switchView = (view) => {
            currentView = view;
            [kanbanView, listView, calendarView, dashboardView].forEach(v => v.classList.add('hidden'));
            document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
            if (view === 'kanban') { kanbanView.classList.remove('hidden'); viewKanbanBtn.classList.add('active'); }
            else if (view === 'list') { listView.classList.remove('hidden'); viewListBtn.classList.add('active'); }
            else if (view === 'calendar') { calendarView.classList.remove('hidden'); viewCalendarBtn.classList.add('active'); }
            else if (view === 'dashboard') { dashboardView.classList.remove('hidden'); viewDashboardBtn.classList.add('active'); }
            
            // Só renderiza se um quadro estiver carregado
            if (currentPlanId) {
                render();
            }
        };
        viewKanbanBtn.addEventListener('click', () => switchView('kanban'));
        viewListBtn.addEventListener('click', () => switchView('list'));
        viewCalendarBtn.addEventListener('click', () => switchView('calendar'));
        viewDashboardBtn.addEventListener('click', () => switchView('dashboard'));
        
        // --- Funções de Import/Export (sem alteração) ---
        const handleExport = () => {
            if (!appData.expenses) { alert("Não há dados para exportar."); return; }
            const rows = [["Categoria", "Item", "Responsavel", "Data", "Valor", "Status"]];
            (appData.categoryOrder || []).forEach(categoryName => {
                (appData.expenses[categoryName] || []).forEach(item => {
                    const row = [
                        categoryName.replace(/"/g, '""'), (item.name || '').replace(/"/g, '""'), (item.responsible || '').replace(/"/g, '""'),
                        item.date || '', item.value || 0, item.completed ? "Pago" : "Pendente"
                    ];
                    rows.push(row);
                });
            });
            let csvContent = "data:text/csv;charset=utf-8," + rows.map(e => e.join(",")).join("\n");
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `planeamento_${currentPlanId}.csv`); // Usa o ID do quadro atual
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        };
        const handleImport = (event) => {
             const file = event.target.files[0]; if (!file) return;
             const reader = new FileReader();
             reader.onload = (e) => {
                 try {
                     const data = new Uint8Array(e.target.result);
                     const workbook = XLSX.read(data, { type: 'array' });
                     const firstSheetName = workbook.SheetNames[0];
                     const worksheet = workbook.Sheets[firstSheetName];
                     const json = XLSX.utils.sheet_to_json(worksheet);
                     if (json.length === 0) { alert("A planilha está vazia ou em formato incorreto."); return; }
                     json.forEach(row => {
                         const category = row.Categoria; const item = row.Item; if (!category || !item) return;
                         if (!appData.expenses[category]) {
                             appData.expenses[category] = [];
                             if (!appData.categoryOrder) appData.categoryOrder = [];
                             if (!appData.categoryOrder.includes(category)) appData.categoryOrder.push(category);
                         }
                         let date = row.Data;
                         if (typeof date === 'number') {
                             const excelDate = new Date((date - 25569) * 86400 * 1000);
                             date = excelDate.toISOString().split('T')[0];
                         } else if (date && (date.includes('/') || date.includes('.'))) {
                            const parts = date.split(/[/.-]/);
                            if(parts.length === 3) {
                                const day = parts[0].padStart(2, '0');
                                const month = parts[1].padStart(2, '0');
                                let year = parts[2];
                                if (year.length === 2) {
                                    year = (parseInt(year) < 70 ? '20' : '19') + year; 
                                }
                                if(!isNaN(parseInt(day)) && !isNaN(parseInt(month)) && !isNaN(parseInt(year)) && year.length === 4) {
                                    date = `${year}-${month}-${day}`;
                                } else {
                                    date = '';
                                }
                            } else {
                                date = '';
                            }
                         } else if (date) {
                             if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) {
                                 date = '';
                             }
                         }
                         appData.expenses[category].push({
                             name: item, responsible: row.Responsavel || '', date: date || '',
                             value: parseFloat(row.Valor) || 0, completed: (row.Status || '').toLowerCase() === 'pago'
                         });
                     });
                     saveCurrentPlanData(); 
                     alert("Planilha importada com sucesso!");
                 } catch (error) {
                     console.error("Erro ao importar planilha:", error);
                     alert("Ocorreu um erro ao processar a planilha. Verifique o formato.");
                 }
             };
             reader.readAsArrayBuffer(file);
             event.target.value = '';
        };
        exportCsvBtn.addEventListener('click', handleExport);
        importCsvBtn.addEventListener('click', () => importFileInput.click());
        importFileInput.addEventListener('change', handleImport);

        // --- CARREGAMENTO INICIAL (Modificado) ---
        const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        applyTheme(savedTheme);
        
        // Em vez de carregar um quadro fixo, mostra a tela de seleção
        showBoardSelectionScreen(); 

    </script>
</body>
</html>
